<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>电路引擎自测</title>
  <style>
    body { font-family: ui-monospace, Consolas, monospace; background: #101820; color: #dbe6f0; padding: 24px; }
    h1 { font-size: 18px; margin: 0 0 12px; }
    .row { padding: 4px 0; font-size: 13px; }
    .pass { color: #6ee7a8; }
    .fail { color: #ff8080; }
    .detail { color: #8aa0b6; margin-left: 10px; }
    #summary { margin-top: 16px; font-size: 15px; font-weight: 700; }
  </style>
</head>
<body>
  <h1>电路引擎自测</h1>
  <div id="out"></div>
  <div id="summary"></div>

  <script src="../assets/js/core/circuit.js?v=52"></script>
  <script>
  (function () {
    var SL = window.SparkLab;
    var out = document.getElementById('out');
    var total = 0, passed = 0;
    var wireSeq = 0;

    function C(type, x, y, props) { return SL.circuit.create(type, x, y, props); }
    function W(a, at, b, bt) {
      wireSeq += 1;
      return { id: 't-w' + wireSeq, from: { compId: a.id, terminalId: at }, to: { compId: b.id, terminalId: bt } };
    }
    function near(actual, expect, tol) { return Math.abs(actual - expect) <= tol; }

    function test(name, fn) {
      total += 1;
      var ok = false, detail = '';
      try {
        var res = fn();
        ok = res === true || (res && res.ok);
        if (res && res.detail) detail = res.detail;
      } catch (e) {
        detail = '异常：' + e.message;
      }
      if (ok) passed += 1;
      var row = document.createElement('div');
      row.className = 'row ' + (ok ? 'pass' : 'fail');
      row.innerHTML = (ok ? 'PASS ' : 'FAIL ') + (total) + '. ' + name +
        (detail ? '<span class="detail">' + detail + '</span>' : '');
      out.appendChild(row);
    }

    function seriesScene(opts) {
      opts = opts || {};
      var bat = C('battery', 300, 400, { cells: opts.cells || 2 });
      var sw = C('switch', 480, 400, { closed: opts.closed !== false });
      var l1 = C('bulb', 660, 400);
      var l2 = C('bulb', 820, 400);
      var scene = {
        components: [bat, sw, l1, l2],
        wires: [
          W(bat, 'pos', sw, 'a'),
          W(sw, 'b', l1, 'a'),
          W(l1, 'b', l2, 'a'),
          W(l2, 'b', bat, 'neg')
        ]
      };
      return { scene: scene, bat: bat, sw: sw, l1: l1, l2: l2 };
    }

    /* 1. 端子坐标与旋转 */
    test('端子坐标 / 旋转 90°', function () {
      var b = C('battery', 100, 100);
      var p = SL.circuit.terminalPoint(b, 'pos');
      b.rotation = 90;
      var q = SL.circuit.terminalPoint(b, 'pos');
      var ok = near(p.x, 148, .01) && near(p.y, 100, .01) && near(q.x, 100, .01) && near(q.y, 148, .01);
      return { ok: ok, detail: 'pos=' + p.x + ',' + p.y + ' → ' + q.x + ',' + q.y };
    });

    /* 2. 串联识别与电流处处相等 */
    test('串联电路识别 + 电流相等', function () {
      var s = seriesScene();
      var r = SL.circuit.solve(s.scene);
      var i1 = Math.abs(r.bulbs[s.l1.id].current);
      var i2 = Math.abs(r.bulbs[s.l2.id].current);
      var ib = Math.abs(r.batteries[s.bat.id].current);
      var ok = r.sceneType === 'series' && near(i1, i2, 1e-6) && near(i1, ib, 1e-6) && near(i1, 0.1698, .003);
      return { ok: ok, detail: 'type=' + r.sceneType + ' I=' + i1.toFixed(4) + ' 期望 0.1698' };
    });

    /* 3. 串联电压关系 U1 + U2 ≈ 电源端电压 */
    test('串联电压 U1+U2 ≈ U源', function () {
      var s = seriesScene();
      var r = SL.circuit.solve(s.scene);
      var u1 = Math.abs(r.bulbs[s.l1.id].voltage);
      var u2 = Math.abs(r.bulbs[s.l2.id].voltage);
      var ub = Math.abs(r.batteries[s.bat.id].voltage);
      var ok = near(u1 + u2, ub, .01) && near(u1, u2, 1e-6) && near(ub, 2.83, .03);
      return { ok: ok, detail: 'U1=' + u1.toFixed(3) + ' U2=' + u2.toFixed(3) + ' U源=' + ub.toFixed(3) };
    });

    /* 4. 开关断开 → 无电流 */
    test('开关断开：电路无电流', function () {
      var s = seriesScene({ closed: false });
      var r = SL.circuit.solve(s.scene);
      var i = Math.abs(r.batteries[s.bat.id].current);
      return { ok: i < 1e-6, detail: 'I=' + i.toExponential(2) };
    });

    /* 4b. 开关闭合但导线断开 → 断路提示 */
    test('导线断开：断路提示', function () {
      var s = seriesScene();
      s.scene.wires.pop();
      var r = SL.circuit.solve(s.scene);
      var i = Math.abs(r.batteries[s.bat.id].current);
      var ok = i < 1e-6 && r.flags.open === true && r.warnings.some(function (w) { return w.type === 'open'; });
      return { ok: ok, detail: 'I=' + i.toExponential(2) + ' flags.open=' + r.flags.open };
    });

    /* 5. 并联识别 + 支路电压相等 + 干路电流为支路和 */
    test('并联电路识别 + 电压相等', function () {
      var bat = C('battery', 300, 400, { cells: 2 });
      var l1 = C('bulb', 600, 300);
      var l2 = C('bulb', 600, 500);
      var scene = {
        components: [bat, l1, l2],
        wires: [W(bat, 'pos', l1, 'a'), W(l1, 'b', bat, 'neg'), W(bat, 'pos', l2, 'a'), W(l2, 'b', bat, 'neg')]
      };
      var r = SL.circuit.solve(scene);
      var u1 = Math.abs(r.bulbs[l1.id].voltage);
      var u2 = Math.abs(r.bulbs[l2.id].voltage);
      var total = Math.abs(r.batteries[bat.id].current);
      var sum = Math.abs(r.bulbs[l1.id].current) + Math.abs(r.bulbs[l2.id].current);
      var ok = r.sceneType === 'parallel' && near(u1, u2, 1e-6) && near(total, sum, 1e-6) && near(u1, 2.419, .05);
      return { ok: ok, detail: 'type=' + r.sceneType + ' U=' + u1.toFixed(3) + ' I总=' + total.toFixed(3) };
    });

    /* 6. 电源短路检测 */
    test('电源短路检测', function () {
      var bat = C('battery', 300, 400, { cells: 2 });
      var scene = { components: [bat], wires: [W(bat, 'pos', bat, 'neg')] };
      var r = SL.circuit.solve(scene);
      var ok = r.flags.short === true && r.warnings.some(function (w) { return w.type === 'short'; });
      return { ok: ok, detail: 'I=' + Math.abs(r.batteries[bat.id].current).toFixed(3) + ' R外=' + (r.batteries[bat.id].voltage / r.batteries[bat.id].current).toFixed(3) };
    });

    /* 7. 电流表反接 */
    test('电流表反接（指针反偏）', function () {
      var s = seriesScene();
      var amp = C('ammeter', 480, 560, { range: 3 });
      s.scene.components.push(amp);
      s.scene.wires = s.scene.wires.filter(function (w) { return !(w.from.compId === s.bat.id && w.from.terminalId === 'pos'); });
      s.scene.wires.push(W(s.bat, 'pos', amp, 'minus'));
      s.scene.wires.push(W(amp, 'plus', s.sw, 'a'));
      var r = SL.circuit.solve(s.scene);
      var m = r.meters[amp.id];
      var ok = !!m && m.reversed === true && m.value < 0;
      return { ok: ok, detail: 'value=' + (m ? m.value.toFixed(4) : 'null') + ' reversed=' + (m && m.reversed) };
    });

    /* 8. 电流表串联在路径上 + 电压表跨接识别 */
    test('电表位置识别', function () {
      var s = seriesScene();
      var amp = C('ammeter', 480, 560, { range: 3 });
      var volt = C('voltmeter', 660, 250, { range: 3 });
      s.scene.components.push(amp, volt);
      s.scene.wires = s.scene.wires.filter(function (w) {
        return !(w.from.compId === s.bat.id && w.from.terminalId === 'pos');
      });
      s.scene.wires.push(W(s.bat, 'pos', amp, 'plus'));
      s.scene.wires.push(W(amp, 'minus', s.sw, 'a'));
      s.scene.wires.push(W(volt, 'plus', s.l1, 'a'));
      s.scene.wires.push(W(volt, 'minus', s.l1, 'b'));
      var r = SL.circuit.solve(s.scene);
      var onPath = r.meterInfo.ammetersOnPath.indexOf(amp.id) !== -1;
      var across = r.meterInfo.voltmeterAcross[volt.id] === s.l1.id;
      var ok = onPath && across && near(Math.abs(r.meters[volt.id].value), Math.abs(r.bulbs[s.l1.id].voltage), .01);
      return { ok: ok, detail: 'ammeterOnPath=' + onPath + ' voltmeterAcross=' + across };
    });

    /* 9. 超量程 */
    test('电表超量程', function () {
      var bat = C('battery', 300, 400, { cells: 2 });
      var amp = C('ammeter', 480, 400, { range: 0.6 });
      var scene = {
        components: [bat, amp],
        wires: [W(bat, 'pos', amp, 'plus'), W(amp, 'minus', bat, 'neg')]
      };
      var r = SL.circuit.solve(scene);
      var m = r.meters[amp.id];
      var ok = !!m && m.overRange === true && r.warnings.some(function (w) { return w.type === 'overRange'; });
      return { ok: ok, detail: 'I=' + (m ? m.value.toFixed(2) : '') + 'A 量程 ' + (m && m.range) };
    });

    /* 10. 滑动变阻器接法识别 */
    test('滑动变阻器“下+下”识别', function () {
      var rheo = C('rheostat', 400, 400, { slider: .5 });
      var bat = C('battery', 200, 400);
      var scene = {
        components: [bat, rheo],
        wires: [W(bat, 'pos', rheo, 'a'), W(rheo, 'b', bat, 'neg')]
      };
      var r = SL.circuit.solve(scene);
      var info = r.rheostats[rheo.id];
      var ok = info.wiring === 'fixed-max' && r.warnings.some(function (w) { return w.type === 'rheostat'; });
      return { ok: ok, detail: 'wiring=' + info.wiring };
    });

    /* 11. 滑动变阻器“一上一下”有效 */
    test('滑动变阻器“一上一下”有效', function () {
      var rheo = C('rheostat', 400, 400, { slider: 1, max: 20 });
      var bat = C('battery', 200, 400, { cells: 2 });
      var scene = {
        components: [bat, rheo],
        wires: [W(bat, 'pos', rheo, 'a'), W(rheo, 'c', bat, 'neg')]
      };
      var r = SL.circuit.solve(scene);
      var info = r.rheostats[rheo.id];
      var i = Math.abs(r.batteries[bat.id].current);
      var ok = info.wiring === 'valid' && near(i, 3 / 21, .005);
      return { ok: ok, detail: 'wiring=' + info.wiring + ' I=' + i.toFixed(4) + ' 期望 ' + (3 / 21).toFixed(4) };
    });

    /* 12. 滑动变阻器 B 柱接法：滑片右移阻值变小 */
    test('滑动变阻器接 B 柱时接入电阻随滑片右移变小', function () {
      var rheo = C('rheostat', 400, 400, { slider: 0.25, max: 20 });
      var bat = C('battery', 200, 400, { cells: 2 });
      var scene = {
        components: [bat, rheo],
        wires: [W(bat, 'pos', rheo, 'b'), W(rheo, 'c', bat, 'neg')]
      };
      var r = SL.circuit.solve(scene);
      var info = r.rheostats[rheo.id];
      var i = Math.abs(r.batteries[bat.id].current);
      var ok = info.wiring === 'valid' && near(info.active, 15, .01) && info.maxAtSlider === 0 && !info.atMax && near(i, 3 / 16, .005);
      return { ok: ok, detail: 'R=' + info.active + 'Ω I=' + i.toFixed(4) + ' 最大端=' + info.maxAtSlider };
    });

    /* 13. 滑动变阻器 B 柱接法：滑片最左为阻值最大端 */
    test('滑动变阻器接 B 柱时滑片最左为阻值最大端', function () {
      var rheo = C('rheostat', 400, 400, { slider: 0, max: 20 });
      var bat = C('battery', 200, 400, { cells: 2 });
      var scene = {
        components: [bat, rheo],
        wires: [W(bat, 'pos', rheo, 'd'), W(rheo, 'b', bat, 'neg')]
      };
      var r = SL.circuit.solve(scene);
      var info = r.rheostats[rheo.id];
      var ok = info.wiring === 'valid' && near(info.active, 20, .01) && info.atMax === true;
      return { ok: ok, detail: 'R=' + info.active + 'Ω atMax=' + info.atMax };
    });

    /* 14. 滑动变阻器 A+B 固定为最大阻值 */
    test('滑动变阻器只接 A+B 时接入电阻恒为最大', function () {
      var rheo = C('rheostat', 400, 400, { slider: 0.2, max: 20 });
      var bat = C('battery', 200, 400, { cells: 2 });
      var scene = {
        components: [bat, rheo],
        wires: [W(bat, 'pos', rheo, 'a'), W(rheo, 'b', bat, 'neg')]
      };
      var r = SL.circuit.solve(scene);
      var info = r.rheostats[rheo.id];
      var ok = info.wiring === 'fixed-max' && near(info.active, 20, .01);
      return { ok: ok, detail: 'wiring=' + info.wiring + ' R=' + info.active };
    });

    /* 15. 灯泡功率比 */
    test('灯泡实际功率超过额定 1.5 倍可被识别', function () {
      var bat = C('battery', 300, 400, { cells: 4 });
      var l1 = C('bulb', 600, 400);
      var scene = { components: [bat, l1], wires: [W(bat, 'pos', l1, 'a'), W(l1, 'b', bat, 'neg')] };
      var r = SL.circuit.solve(scene);
      var ratio = r.bulbs[l1.id].ratio;
      var ok = ratio > 1.5;
      return { ok: ok, detail: 'ratio=' + ratio.toFixed(2) };
    });

    /* 13. 空场景不报错 */
    test('空场景求解', function () {
      var r = SL.circuit.solve({ components: [], wires: [] });
      return { ok: r.ok === true && r.sceneType === 'other' };
    });

    /* 14. ID 唯一性（恢复场景后新增元件不冲突） */
    test('恢复场景后新增元件 ID 不冲突', function () {
      var old = SL.circuit.create('bulb', 100, 100);
      var scene = { components: [old], wires: [] };
      SL.circuit.syncIds(scene);
      var fresh = SL.circuit.create('bulb', 200, 100);
      return { ok: fresh.id !== old.id, detail: old.id + ' / ' + fresh.id };
    });

    /* ---------- 新增元件 ---------- */
    /* 16. 学生电源：6V、内阻 0.5Ω，接 10Ω */
    test('学生电源 6V + 10Ω：I≈0.571A', function () {
      var sup = C('dcsupply', 300, 400, { voltage: 6 });
      var res = C('resistor', 520, 400, { resistance: 10 });
      var scene = {
        components: [sup, res],
        wires: [W(sup, 'pos', res, 'a'), W(res, 'b', sup, 'neg')]
      };
      var r = SL.circuit.solve(scene);
      var info = r.supplies[sup.id];
      var i = info ? Math.abs(info.current) : 0;
      var ok = !!info && near(i, 6 / 10.5, 0.002) && near(info.voltage, 6 - i * 0.5, 0.01);
      return { ok: ok, detail: 'I=' + i.toFixed(4) + ' U端=' + (info ? info.voltage.toFixed(3) : '—') };
    });

    /* 17. 电阻箱：四位旋钮 [1,2,3,4] = 1234Ω */
    test('电阻箱 [1,2,3,4] → 1234Ω', function () {
      var sup = C('dcsupply', 300, 400, { voltage: 6 });
      var box = C('resistance-box', 520, 400, { digits: [1, 2, 3, 4] });
      var scene = {
        components: [sup, box],
        wires: [W(sup, 'pos', box, 'a'), W(box, 'b', sup, 'neg')]
      };
      var r = SL.circuit.solve(scene);
      var info = r.resistors[box.id];
      var i = info ? Math.abs(info.current) : 0;
      var R = i > 1e-9 ? Math.abs(info.voltage / info.current) : 0;
      var ok = !!info && near(R, 1234, 1) && near(i, 6 / 1234.5, 1e-4);
      return { ok: ok, detail: 'R=' + R.toFixed(1) + 'Ω I=' + i.toFixed(5) };
    });

    /* 18. 单刀双掷开关：to=b 时 a-b 通、a-c 断 */
    test('单刀双掷开关 to=b：a-b 通、a-c 断', function () {
      var sup = C('dcsupply', 200, 400, { voltage: 6 });
      var spdt = C('switch-spdt', 400, 400, { to: 'b' });
      var r1 = C('resistor', 620, 280, { resistance: 10 });
      var r2 = C('resistor', 620, 520, { resistance: 10 });
      var scene = {
        components: [sup, spdt, r1, r2],
        wires: [
          W(sup, 'pos', spdt, 'a'),
          W(spdt, 'b', r1, 'a'),
          W(r1, 'b', sup, 'neg'),
          W(spdt, 'c', r2, 'a'),
          W(r2, 'b', sup, 'neg')
        ]
      };
      var r = SL.circuit.solve(scene);
      var i1 = Math.abs(r.components[r1.id].voltage / 10);
      var i2 = Math.abs(r.components[r2.id].voltage / 10);
      var ok = r.switches[spdt.id].closedTo === 'b' && i1 > 0.1 && i2 < 1e-6;
      return { ok: ok, detail: 'closedTo=' + r.switches[spdt.id].closedTo + ' I(b)=' + i1.toFixed(3) + ' I(c)=' + i2.toExponential(1) };
    });

    /* 19. LED 正向导通：5V + 10Ω */
    test('LED 正向导通（5V + 10Ω，I>0.05A）', function () {
      var sup = C('dcsupply', 300, 400, { voltage: 5 });
      var led = C('led', 480, 400);
      var res = C('resistor', 660, 400, { resistance: 10 });
      var scene = {
        components: [sup, led, res],
        wires: [W(sup, 'pos', led, 'anode'), W(led, 'cathode', res, 'a'), W(res, 'b', sup, 'neg')]
      };
      var r = SL.circuit.solve(scene);
      var info = r.leds[led.id];
      var ok = !!info && info.on === true && info.current > 0.05 && info.voltage >= 1.8;
      return { ok: ok, detail: 'on=' + (info && info.on) + ' I=' + (info ? info.current.toFixed(4) : '—') + ' U=' + (info ? info.voltage.toFixed(3) : '—') };
    });

    /* 20. LED 反向截止 */
    test('LED 反向截止（on=false，I≈0）', function () {
      var sup = C('dcsupply', 300, 400, { voltage: 5 });
      var led = C('led', 480, 400);
      var res = C('resistor', 660, 400, { resistance: 10 });
      var scene = {
        components: [sup, led, res],
        wires: [W(sup, 'pos', led, 'cathode'), W(led, 'anode', res, 'a'), W(res, 'b', sup, 'neg')]
      };
      var r = SL.circuit.solve(scene);
      var info = r.leds[led.id];
      var ok = !!info && info.on === false && Math.abs(info.current) < 1e-6;
      return { ok: ok, detail: 'on=' + (info && info.on) + ' I=' + (info ? info.current.toExponential(2) : '—') };
    });

    /* 21. 保险丝：0.3A 额定，约 1A 电流下熔断并断路 */
    test('保险丝 0.3A 在约 1A 电流下熔断并断路', function () {
      var sup = C('dcsupply', 300, 400, { voltage: 6 });
      var res = C('resistor', 660, 400, { resistance: 5 });
      var fuse = C('fuse', 480, 400, { rating: 2 });
      var scene = {
        components: [sup, fuse, res],
        wires: [W(sup, 'pos', fuse, 'a'), W(fuse, 'b', res, 'a'), W(res, 'b', sup, 'neg')]
      };
      var r1 = SL.circuit.solve(scene);
      var before = Math.abs(r1.fuses[fuse.id].current);
      fuse.props.rating = 0.3;
      var r2 = SL.circuit.solve(scene);
      var after = Math.abs(r2.fuses[fuse.id].current);
      var warn = r2.warnings.some(function (w) { return w.type === 'fuse' && w.compId === fuse.id; });
      var ok = near(before, 6 / 5.55, 0.02) && fuse.props.blown === true &&
        r2.fuses[fuse.id].blown === true && after < 1e-6 && warn;
      return { ok: ok, detail: '熔断前 I=' + before.toFixed(3) + 'A，熔断后 I=' + after.toExponential(1) + 'A，warning=' + warn };
    });

    /* 22. 电动机：基本电流、功率与转动状态 */
    test('电动机 6V + 10Ω：转动', function () {
      var sup = C('dcsupply', 300, 400, { voltage: 6 });
      var motor = C('motor', 560, 400, { resistance: 10 });
      var scene = {
        components: [sup, motor],
        wires: [W(sup, 'pos', motor, 'a'), W(motor, 'b', sup, 'neg')]
      };
      var r = SL.circuit.solve(scene);
      var info = r.motors[motor.id];
      var i = Math.abs(info.current);
      var ok = near(i, 6 / 10.5, 0.002) && info.spinning === true && near(Math.abs(info.power), 3.265, 0.02);
      return { ok: ok, detail: 'I=' + i.toFixed(3) + ' P=' + info.power.toFixed(2) + ' 转动=' + info.spinning };
    });

    /* 23. 电铃：基本电流与响铃状态 */
    test('电铃 6V + 20Ω：响铃', function () {
      var sup = C('dcsupply', 300, 400, { voltage: 6 });
      var bell = C('bell', 560, 400, { resistance: 20 });
      var scene = {
        components: [sup, bell],
        wires: [W(sup, 'pos', bell, 'a'), W(bell, 'b', sup, 'neg')]
      };
      var r = SL.circuit.solve(scene);
      var info = r.bells[bell.id];
      var i = Math.abs(info.current);
      var ok = near(i, 6 / 20.5, 0.002) && info.ringing === true;
      return { ok: ok, detail: 'I=' + i.toFixed(3) + ' 响铃=' + info.ringing };
    });

    /* 24. 电磁铁：电流方向决定 N 极位置 */
    test('电磁铁 6V + 5Ω：通电与极性', function () {
      function build(reverse) {
        var sup = C('dcsupply', 300, 400, { voltage: 6 });
        var mag = C('electromagnet', 560, 400, { resistance: 5 });
        var scene = {
          components: [sup, mag],
          wires: reverse
            ? [W(sup, 'pos', mag, 'b'), W(mag, 'a', sup, 'neg')]
            : [W(sup, 'pos', mag, 'a'), W(mag, 'b', sup, 'neg')]
        };
        return { scene: scene, mag: mag };
      }
      var a = build(false);
      var ra = SL.circuit.solve(a.scene);
      var b = build(true);
      var rb = SL.circuit.solve(b.scene);
      var ia = Math.abs(ra.electromagnets[a.mag.id].current);
      var ok = near(ia, 6 / 5.5, 0.003) && ra.electromagnets[a.mag.id].on === true &&
        ra.electromagnets[a.mag.id].poleN === 'left' && rb.electromagnets[b.mag.id].poleN === 'right';
      return { ok: ok, detail: 'I=' + ia.toFixed(3) + ' 正接N=' + ra.electromagnets[a.mag.id].poleN + ' 反接N=' + rb.electromagnets[b.mag.id].poleN };
    });

    /* 25. 手摇发电机：6V、内阻 0.8Ω，接 10Ω */
    test('发电机 6V + 10Ω：I≈0.556A', function () {
      var gen = C('generator', 300, 400, { voltage: 6, running: true });
      var res = C('resistor', 520, 400, { resistance: 10 });
      var scene = {
        components: [gen, res],
        wires: [W(gen, 'pos', res, 'a'), W(res, 'b', gen, 'neg')]
      };
      var r = SL.circuit.solve(scene);
      var info = r.generators[gen.id];
      var i = info ? Math.abs(info.current) : 0;
      var ok = !!info && near(info.emf, 6, 1e-6) && near(i, 6 / 10.8, 0.003);
      return { ok: ok, detail: 'emf=' + (info && info.emf) + ' I=' + i.toFixed(4) + ' 期望 ' + (6 / 10.8).toFixed(4) };
    });

    /* 26. 手摇发电机停止：电动势 0，电路无电流 */
    test('发电机停止摇动：输出 0V、I≈0', function () {
      var gen = C('generator', 300, 400, { voltage: 6, running: false });
      var res = C('resistor', 520, 400, { resistance: 10 });
      var scene = {
        components: [gen, res],
        wires: [W(gen, 'pos', res, 'a'), W(res, 'b', gen, 'neg')]
      };
      var r = SL.circuit.solve(scene);
      var info = r.generators[gen.id];
      var i = info ? Math.abs(info.current) : 0;
      var ok = !!info && info.emf === 0 && i < 1e-6;
      return { ok: ok, detail: 'emf=' + (info && info.emf) + ' I=' + i.toExponential(2) };
    });

    /* 27. 电磁继电器吸合：线圈电流 ≥0.02A，com–no 导通 */
    test('继电器吸合：com–no 导通', function () {
      var sup = C('dcsupply', 300, 400, { voltage: 6 });
      var relay = C('relay', 520, 400);
      var load = C('bulb', 720, 400);
      var scene = {
        components: [sup, relay, load],
        wires: [
          W(sup, 'pos', relay, 'coilA'),
          W(relay, 'coilB', sup, 'neg'),
          W(sup, 'pos', relay, 'com'),
          W(relay, 'no', load, 'a'),
          W(load, 'b', sup, 'neg')
        ]
      };
      var r = SL.circuit.solve(scene);
      var info = r.relays[relay.id];
      var iLoad = Math.abs(r.bulbs[load.id].current);
      var ok = !!info && info.energized === true && Math.abs(info.coilCurrent) >= 0.02 && iLoad > 0.1;
      return { ok: ok, detail: '吸合=' + (info && info.energized) + ' I线圈=' + (info ? Math.abs(info.coilCurrent).toFixed(3) : '—') + ' I负载=' + iLoad.toFixed(3) };
    });

    /* 28. 电磁继电器释放：线圈电流 <0.02A，com–nc 导通 */
    test('继电器释放：com–nc 导通', function () {
      var sup = C('dcsupply', 300, 400, { voltage: 6 });
      var relay = C('relay', 520, 400);
      var coilR = C('resistor', 520, 260, { resistance: 1000 });
      var load = C('bulb', 720, 400);
      var scene = {
        components: [sup, relay, coilR, load],
        wires: [
          W(sup, 'pos', relay, 'coilA'),
          W(relay, 'coilB', coilR, 'a'),
          W(coilR, 'b', sup, 'neg'),
          W(sup, 'pos', relay, 'com'),
          W(relay, 'nc', load, 'a'),
          W(load, 'b', sup, 'neg')
        ]
      };
      var r = SL.circuit.solve(scene);
      var info = r.relays[relay.id];
      var iLoad = Math.abs(r.bulbs[load.id].current);
      var ok = !!info && info.energized === false && Math.abs(info.coilCurrent) < 0.02 && iLoad > 0.1;
      return { ok: ok, detail: '吸合=' + (info && info.energized) + ' I线圈=' + (info ? Math.abs(info.coilCurrent).toFixed(4) : '—') + ' I负载=' + iLoad.toFixed(3) };
    });

    /* 29. 扬声器：8Ω，电流与功率 */
    test('扬声器 6V + 8Ω：发声', function () {
      var sup = C('dcsupply', 300, 400, { voltage: 6 });
      var spk = C('speaker', 520, 400);
      var scene = {
        components: [sup, spk],
        wires: [W(sup, 'pos', spk, 'a'), W(spk, 'b', sup, 'neg')]
      };
      var r = SL.circuit.solve(scene);
      var info = r.speakers[spk.id];
      var i = info ? Math.abs(info.current) : 0;
      var ok = !!info && near(i, 6 / 8.5, 0.005) && info.active === true && near(Math.abs(info.power), 3.986, 0.05);
      return { ok: ok, detail: 'I=' + i.toFixed(3) + ' P=' + (info ? Math.abs(info.power).toFixed(2) : '—') + ' 发声=' + (info && info.active) };
    });

    /* 30. 灵敏电流计：正负读数与超量程标记 */
    test('灵敏电流计：正负读数 / 超量程', function () {
      var sup = C('dcsupply', 300, 400, { voltage: 6 });
      var gal = C('galvanometer', 520, 400, { range: 0.1 });
      var res = C('resistor', 720, 400, { resistance: 100 });
      var forward = {
        components: [sup, gal, res],
        wires: [W(sup, 'pos', gal, 'plus'), W(gal, 'minus', res, 'a'), W(res, 'b', sup, 'neg')]
      };
      var rf = SL.circuit.solve(forward);
      var mf = rf.meters[gal.id];
      var reverse = {
        components: [sup, gal, res],
        wires: [W(sup, 'pos', gal, 'minus'), W(gal, 'plus', res, 'a'), W(res, 'b', sup, 'neg')]
      };
      var rr = SL.circuit.solve(reverse);
      var mr = rr.meters[gal.id];
      gal.props.range = 0.05;
      var ro = SL.circuit.solve(forward);
      var mo = ro.meters[gal.id];
      var ok = !!mf && !!mr && near(mf.value, 6 / 101, 1e-3) && mr.value < 0 && mf.overRange === false &&
        mo.overRange === true && ro.warnings.some(function (w) { return w.type === 'overRange' && w.compId === gal.id; });
      return { ok: ok, detail: '正=' + (mf ? mf.value.toFixed(4) : '—') + ' 反=' + (mr ? mr.value.toFixed(4) : '—') + ' 超量程=' + (mo && mo.overRange) };
    });

    var summary = document.getElementById('summary');
    summary.textContent = (passed === total ? 'PASS ' : 'FAIL ') + passed + ' / ' + total;
    summary.className = passed === total ? 'pass' : 'fail';
    document.title = (passed === total ? 'PASS ' : 'FAIL ') + passed + '/' + total;
    window.__testDone = true;
  })();
  </script>
</body>
