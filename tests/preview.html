  <script>
    (function () {
      var SL = window.SparkLab;
      var q = new URLSearchParams(location.search);
      var lab = q.get('lab') || 'lever';
      var mode = q.get('mode') || 'guided';
      window.addEventListener('load', function () {
        SL.records.clear(lab);
        SL.storage.remove(SL.KEYS.progress);
        SL.settings.set('sound', false);
        SL.app.openLab(lab, mode);
        if (q.get('device')) SL.app.state.controls.set('device', q.get('device'));
        if (q.get('sub')) SL.app.state.controls.set('submerge', parseFloat(q.get('sub')));
        if (q.get('n')) SL.app.state.controls.set('segments', parseFloat(q.get('n')));
        if (q.get('lift')) {
          SL.app.state.controls.set('h', 0.3);
          SL.labs[lab].onTick(6, SL.app.state);
        }
        if (q.get('h')) SL.app.state.controls.set('h', parseFloat(q.get('h')));
        /* 刚体沙盒：?scene=demo|stack|alone 摆一套固定装置，方便截图核对 */
        var scene = q.get('scene');
        if (scene && SL.app.state.kind === 'rigid') {
          var st = SL.app.state;
          var sandbox = SL.labs['mech-sandbox'];
          var R = SL.rigid;
          st.rigid.clear();
          sandbox.setup({ rigid: st.rigid, stage: st.stage });
          if (scene === 'demo') {
            sandbox.demo(st.rigid);
          } else if (scene === 'stack') {
            var big = R.devices.balance(st.rigid, 450, sandbox.floorY);
            var panTop = big.parts.panL.bounds.min.y;
            var small = R.devices.stackBalance(st.rigid, 450 - 116, panTop);
            var smallMass = small.bodies.reduce(function (a, b) { return a + b.mass; }, 0);
            R.devices.block(st.rigid, 450 + 116, panTop - 15, { w: 40, h: 30, density: smallMass / 1200 });
            R.devices.block(st.rigid, 150, sandbox.floorY - 20, { tone: 2 });
            SL.app.rigidSelect(small.parts.beam);
          } else if (scene === 'alone') {
            R.devices.ramp(st.rigid, 730, sandbox.floorY, { len: 200, thick: 10, angle: 22 });
            var bal2 = R.devices.balance(st.rigid, 200, sandbox.floorY);
            var pt = bal2.parts.panL.bounds.min.y;
            R.devices.block(st.rigid, 200 - 116, pt - 21, { tone: 0 });
            SL.app.rigidSelect(bal2.parts.beam);
          }
          if (st.clock) st.clock.start();
        }
        /* 选中第 n 个元件并打开属性面板（截图核对换向按钮用），?flip=1 再点一下换向 */
        if (q.get('sel')) {
          var comps = SL.app.state.board.getScene().components;
          var target = comps[parseInt(q.get('sel'), 10)] || comps[0];
          if (target) {
            SL.app.state.board.options.onInspect(target.id);
            var flip = document.getElementById('insp-flip');
            if (flip && q.get('flip')) flip.click();
          }
        }
      });
    })();
  </script>
