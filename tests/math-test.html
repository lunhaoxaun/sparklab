<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>数学绘图器引擎自测</title>
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/vendor/jsxgraph/jsxgraph.css">
  <style>
    body { font-family: var(--font); background: #eef2f9; color: var(--ink); padding: 20px; }
    h1 { font-size: 16px; margin: 0 0 10px; }
    #out { font: 12.5px/1.75 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; }
    .pass { color: #1a7a4f; }
    .fail { color: #c0392b; font-weight: 700; }
    #summary { margin-top: 14px; font-size: 15px; font-weight: 700; }
    /* 离屏容器仍保留 960×600 的布局尺寸，board 靠 clientWidth/Height 取画布大小 */
    #host { position: absolute; left: -9999px; top: 0; width: 980px; height: 640px; }
    #stage { width: 960px; height: 600px; }
    #stage2, #stage3, #stage4 { width: 640px; height: 480px; }
    /* lab.js 需要真实布局尺寸才能算出画布宽高 */
    #labhost { position: absolute; left: -9999px; top: 0; width: 1240px; }
  </style>
</head>
<body>
  <h1>数学绘图器自测（表达式 · 判断脚本 · JSXGraph 画板 · 帮助页）</h1>
  <div id="out">运行中…</div>
  <div id="summary"></div>
  <div id="host">
    <div id="stage"></div>
    <div id="stage2"></div>
    <div id="stage3"></div>
    <div id="stage4"></div>
  </div>
  <div id="labhost"></div>

  <script src="../assets/js/core/utils.js"></script>
  <script src="../assets/js/core/simkit.js"></script>
  <script src="../assets/js/math/expr.js"></script>
  <script src="../assets/js/math/script.js"></script>
  <script src="../assets/js/math/help.js"></script>
  <script src="../assets/vendor/jsxgraph/jsxgraphcore.js"></script>
  <script src="../assets/js/math/board.js"></script>
  <script src="../assets/js/math/lab.js"></script>
  <script>
  (function () {
    var SL = window.SparkLab;
    var out = document.getElementById('out');
    var summary = document.getElementById('summary');
    var lines = [];
    var pass = 0, fail = 0;

    function esc(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    function ok(name, cond, detail) {
      if (cond) { pass += 1; lines.push('PASS  ' + name + (detail ? '  [' + detail + ']' : '')); }
      else { fail += 1; lines.push('FAIL  ' + name + (detail ? '  [' + detail + ']' : '')); }
    }
    function near(a, b, tol) {
      return typeof a === 'number' && typeof b === 'number' && Math.abs(a - b) <= (tol == null ? 1e-9 : tol);
    }
    function num(n) { return typeof n === 'number' && !isNaN(n); }
    function flush() {
      out.innerHTML = lines.map(function (l) {
        return '<span class="' + (l.indexOf('PASS') === 0 ? 'pass' : 'fail') + '">' + esc(l) + '</span>';
      }).join('\n') + '\n\n合计：' + pass + ' 通过 / ' + fail + ' 失败';
      summary.textContent = fail ? (fail + ' 项失败') : (pass + ' 项全部通过');
      document.title = fail ? 'FAIL ' + fail : 'PASS ' + pass + '/' + (pass + fail);
      window.__testDone = true;
    }

    function run() {
      var E = SL.math.expr, S = SL.math.script, H = SL.math.help, B = SL.math.board;

      ok('四个模块都已导出（expr / script / help / board）',
        !!(E && S && H && B && B.create) && !!window.JXG,
        'JXG=' + (window.JXG ? window.JXG.version : 'none'));

      /* ================= 一、表达式引擎 ================= */
      function ev(src, x, params) {
        var c = E.compile(src);
        return c.ok ? c.eval(x, params || {}) : NaN;
      }
      ok('表达式 x^2-2x+1 @2 = 1', near(ev('x^2-2x+1', 2), 1), String(ev('x^2-2x+1', 2)));
      ok('表达式 2x 隐式乘法 @3 = 6', near(ev('2x', 3), 6), String(ev('2x', 3)));
      ok('表达式 3(x+1) @2 = 9', near(ev('3(x+1)', 2), 9), String(ev('3(x+1)', 2)));
      ok('表达式 (x+1)(x-1) @3 = 8', near(ev('(x+1)(x-1)', 3), 8), String(ev('(x+1)(x-1)', 3)));
      ok('表达式 2^3^2 = 512（^ 右结合）', near(ev('2^3^2', 0), 512), String(ev('2^3^2', 0)));
      ok('表达式 -2^2 = -4（一元负号低于幂）', near(ev('-2^2', 0), -4), String(ev('-2^2', 0)));
      ok('表达式 sin(pi/2) ≈ 1（弧度）', near(ev('sin(pi/2)', 0), 1, 1e-9), String(ev('sin(pi/2)', 0)));
      ok('表达式 sind(30) ≈ 0.5（角度）', near(ev('sind(30)', 0), 0.5, 1e-9), String(ev('sind(30)', 0)));
      var cParam = E.compile('a*x+b');
      ok('表达式 a*x+b 的 freeVars 含 a、b 且不含 x',
        cParam.ok && cParam.freeVars.indexOf('a') >= 0 && cParam.freeVars.indexOf('b') >= 0 &&
        cParam.freeVars.indexOf('x') < 0, JSON.stringify(cParam.freeVars));
      ok('带参数求值 a*x+b @4 (a=2,b=3) = 11', near(cParam.eval(4, { a: 2, b: 3 }), 11),
        String(cParam.eval(4, { a: 2, b: 3 })));
      var bad = E.compile('1+');
      ok("表达式 '1+' 编译失败且 error 带 line/col",
        bad.ok === false && !!bad.error && num(bad.error.line) && num(bad.error.col),
        bad.error ? (bad.error.message + ' @' + bad.error.line + ':' + bad.error.col) : 'ok=true');
      ok('表达式 sqrt(-1) = NaN（定义域外）', isNaN(ev('sqrt(-1)', 0)), String(ev('sqrt(-1)', 0)));

      /* ================= 二、C++ 判断脚本 ================= */
      var BC = { name: 'BC', type: 'segment', num: 1, color: '#000000', length: 5, slope: 0.75, visible: true, ok: false, msg: '' };
      var A = { name: 'A', type: 'point', x: 0, y: 0 };
      var BP = { name: 'B', type: 'point', x: 3, y: 4 };
      var C = { name: 'C', type: 'point', x: 3, y: 0 };
      var OBJ = { BC: BC, A: A, B: BP, C: C };
      var RO = { name: 1, type: 1, length: 1, slope: 1 };
      function proxy(d, readonly) {
        return {
          get: function (p) { return Object.prototype.hasOwnProperty.call(d, p) ? d[p] : undefined; },
          set: function (p, v) {
            if (readonly[p]) throw new Error('属性只读: ' + p);
            if (!Object.prototype.hasOwnProperty.call(d, p)) throw new Error('对象没有属性: ' + p);
            d[p] = v;
          },
          call: function (m) { throw new Error('对象没有方法: ' + m); }
        };
      }
      var bridge = {
        resolve: function (n) { return OBJ[n] ? proxy(OBJ[n], RO) : undefined; },
        isObjectName: function (n) { return !!OBJ[n]; }
      };
      function runS(src, opts) { return S.run(src, bridge, opts); }

      var r1 = runS('int n = 2; if (n == 2) { pass("ok"); } else { fail("no"); }');
      ok('脚本 int/if/else → pass("ok")', r1.ok && r1.results.length === 1 && r1.results[0].kind === 'pass',
        'ok=' + r1.ok + ' results=' + JSON.stringify(r1.results));

      var r2 = runS('double s=0; for(int i=1;i<=5;i++){ s+=i; } print(s);');
      ok('脚本 for 求和 = 15（print 输出）',
        r2.ok && r2.logs.length === 1 && r2.logs[0].level === 'print' && r2.logs[0].text === '15',
        JSON.stringify(r2.logs));

      var r3a = runS('while (false) {}');
      var r3b = runS('while (true) {}', { maxLoop: 200 });
      ok('脚本 while(false) 正常结束；while(true) 触发循环预算',
        r3a.ok === true && r3b.ok === false && !!r3b.error &&
        r3b.error.message.indexOf('循环次数') >= 0 && num(r3b.error.line),
        'false→ok=' + r3a.ok + '；true→' + (r3b.error && r3b.error.message));

      BC.num = 1; BC.color = '#000000';
      var r4 = runS('BC.num = 2; BC.color = "red";');
      ok('脚本 写入 BC.num / BC.color 并读回代理',
        r4.ok && BC.num === 2 && BC.color === 'red',
        'num=' + BC.num + ' color=' + BC.color);

      BC.color = '#000000'; BC.num = 2;
      var r5 = runS('if (BC.num == 2) BC.color = "red";');
      ok('脚本 用户原始示例 if (BC.num == 2) BC.color = "red"; 生效',
        r5.ok && BC.color === 'red', 'ok=' + r5.ok + ' color=' + BC.color);

      var r6 = runS('print(near(0.1+0.2, 0.3));');
      ok('脚本 near(0.1+0.2, 0.3) = true',
        r6.ok && r6.logs.length === 1 && r6.logs[0].text === 'true', JSON.stringify(r6.logs));

      var r7 = runS('Foo.x = 1;');
      ok('脚本 未定义对象 Foo 报错且带 line/col',
        r7.ok === false && !!r7.error && num(r7.error.line) && num(r7.error.col) &&
        r7.error.message.indexOf('Foo') >= 0,
        r7.error ? (r7.error.message + ' @' + r7.error.line + ':' + r7.error.col) : 'ok=true');

      var r8 = runS('BC.name = "X";');
      ok('脚本 只读属性写入被拒绝', r8.ok === false && !!r8.error && BC.name === 'BC',
        r8.error ? r8.error.message : 'ok=true');

      /* ================= 三、JSXGraph 画板（board） ================= */
      var stage = document.getElementById('stage');
      var sc = {
        view: { cx: 0, cy: 0, pxPerUnit: 48 },
        params: {}, expressions: [], objects: [], script: '', autoRun: true
      };
      var board = B.create(stage, sc, {});

      function gridPath() {
        var ps = stage.querySelectorAll('path');
        for (var gi = 0; gi < ps.length; gi += 1) {
          var gd = ps[gi].getAttribute('d') || '';
          if ((gd.match(/M/g) || []).length >= 4) return ps[gi];
        }
        return null;
      }
      ok('board 创建：容器内生成 SVG、坐标轴（line）与网格（多段 path）',
        !!board && typeof board.addPoint === 'function' &&
        !!stage.querySelector('svg') && stage.querySelectorAll('line').length >= 2 &&
        !!gridPath(),
        'svg=' + !!stage.querySelector('svg') + ' axis=' + stage.querySelectorAll('line').length +
        ' grid=' + !!gridPath());

      var sp0 = board.toScreen(0, 0);
      ok('toScreen(0,0) 在 960×600 画布中心',
        near(sp0.x, 480, 1) && near(sp0.y, 300, 1),
        '(' + sp0.x.toFixed(2) + ',' + sp0.y.toFixed(2) + ')');

      var rt = board.toScreen(1.5, -2.5);
      var back = board.toWorld(rt.x, rt.y);
      ok('toWorld(toScreen(1.5,-2.5)) 往返误差 < 1e-6',
        near(back.x, 1.5, 1e-6) && near(back.y, -2.5, 1e-6),
        '(' + back.x + ',' + back.y + ')');

      var pA = board.addPoint(0, 0);
      var pB = board.addPoint(3, 4);
      var pC = board.addPoint(0, 3);
      ok('点工具：标签 A / B / C 依次递增，坐标写回 scene',
        pA && pB && pC && pA.label === 'A' && pB.label === 'B' && pC.label === 'C' &&
        sc.objects.length === 3, 'labels=' + [pA.label, pB.label, pC.label].join(','));

      var seg = board.addSegment(pA.id, pB.id);
      var ms = board.measure(seg.id);
      ok('线段：标签 AB、长度 5、斜率 4/3',
        seg && seg.label === 'AB' && near(ms.length, 5) && near(ms.slope, 4 / 3),
        'label=' + seg.label + ' length=' + ms.length + ' slope=' + ms.slope);

      var cir = board.addCircle(pA.id, pB.id);
      var mc = board.measure(cir.id);
      ok('圆：标签 c1、半径 5、面积 25π',
        cir && cir.label === 'c1' && near(mc.radius, 5) && near(mc.area, Math.PI * 25),
        'label=' + cir.label + ' R=' + mc.radius + ' S=' + mc.area);

      var poly = board.addPolygon([pA.id, pB.id, pC.id]);
      var mp = board.measure(poly.id);
      ok('多边形：三点成三角形，面积 4.5、周长 5+√10+3',
        poly && poly.label === 'poly1' && near(mp.area, 4.5) &&
        near(mp.perimeter, 5 + Math.sqrt(10) + 3),
        'label=' + poly.label + ' area=' + mp.area + ' peri=' + mp.perimeter);

      var mid = board.addMidpoint(pA.id, pB.id);
      ok('中点：标签 M1、坐标 (1.5, 2)',
        mid && mid.label === 'M1' && near(board.getProp(mid.id, 'x'), 1.5) &&
        near(board.getProp(mid.id, 'y'), 2),
        'label=' + mid.label + ' (' + board.getProp(mid.id, 'x') + ',' + board.getProp(mid.id, 'y') + ')');

      var pD = board.addPoint(0, 4);
      var pE = board.addPoint(4, 0);
      var l1 = board.addLine(pA.id, pB.id);
      var l2 = board.addLine(pD.id, pE.id);
      var xi = board.addIntersection(l1.id, l2.id, 0);
      ok('交点：标签 X1、坐标 (12/7, 16/7)',
        xi && xi.label === 'X1' &&
        near(board.getProp(xi.id, 'x'), 12 / 7, 1e-6) &&
        near(board.getProp(xi.id, 'y'), 16 / 7, 1e-6),
        'label=' + xi.label + ' (' + board.getProp(xi.id, 'x') + ',' + board.getProp(xi.id, 'y') + ')');

      var perp = board.addPerpendicular(pC.id, l1.id);
      var mpd = board.measure(perp.id);
      ok('垂线：标签 p1、斜率 -3/4',
        perp && perp.label === 'p1' && near(mpd.slope, -0.75),
        'label=' + perp.label + ' slope=' + mpd.slope);

      var para = board.addParallel(pC.id, l1.id);
      var mpa = board.measure(para.id);
      ok('平行线：斜率与 AB 相同（4/3）', para && near(mpa.slope, 4 / 3),
        'label=' + para.label + ' slope=' + mpa.slope);

      var hitSp = board.toScreen(0, 0);
      ok('pick：在点 A 附近返回 A 的 id',
        board.pick(hitSp.x, hitSp.y) === pA.id,
        'hit=' + board.pick(hitSp.x, hitSp.y) + ' A=' + pA.id);

      /* 移动 A：JXG 自动重算依赖对象（等价于拖动） */
      board.setProp(pA.id, 'x', 1);
      board.setProp(pA.id, 'y', 1);
      board.syncScene(sc);
      var len2 = board.measure(seg.id).length;
      var rad2 = board.measure(cir.id).radius;
      var area2 = board.measure(poly.id).area;
      ok('拖动 A 到 (1,1) 后线段 / 圆 / 多边形级联重算',
        near(len2, Math.sqrt(13), 1e-6) && near(rad2, Math.sqrt(13), 1e-6) && near(area2, 3.5, 1e-6),
        'len=' + len2.toFixed(4) + ' R=' + rad2.toFixed(4) + ' area=' + area2.toFixed(4));

      board.setProp(seg.id, 'num', 2);
      board.setProp(seg.id, 'color', 'red');
      ok('setProp：num 可写、色名归一化为 #d94b4b',
        board.getProp(seg.id, 'num') === 2 && board.getProp(seg.id, 'color') === '#d94b4b',
        'num=' + board.getProp(seg.id, 'num') + ' color=' + board.getProp(seg.id, 'color'));

      board.setProp(seg.id, 'visible', false);
      var hiddenOk = board.getProp(seg.id, 'visible') === false;
      board.setProp(seg.id, 'visible', true);
      ok('setProp：visible 隐藏 / 恢复', hiddenOk && board.getProp(seg.id, 'visible') === true,
        'hidden=' + hiddenOk);

      var threw = false;
      try { board.setProp(pA.id, 'label', 'Z'); } catch (e1) { threw = true; }
      ok('setProp：只读属性（label）抛错', threw && pA.label === 'A',
        threw ? 'threw' : 'no throw');

      /* 脚本桥接：按 label 找到 AB，get/set 转发到 board（等价于 lab.js 的 bridge） */
      var segProxy = {
        get: function (p) { return board.getProp(seg.id, p); },
        set: function (p, v) { board.setProp(seg.id, p, v); },
        call: function (m) { throw new Error('对象没有方法: ' + m); }
      };
      var boardBridge = {
        resolve: function (n) { return n === 'AB' ? segProxy : undefined; },
        isObjectName: function (n) { return n === 'AB'; }
      };
      board.setProp(seg.id, 'color', '#000000');
      board.setProp(seg.id, 'num', 2);
      var rs = S.run('if (AB.num == 2) AB.color = "red";', boardBridge);
      ok('board 桥接：脚本 if (AB.num == 2) AB.color = "red"; 改色成功',
        rs.ok && board.getProp(seg.id, 'color') === '#d94b4b',
        'ok=' + rs.ok + ' color=' + board.getProp(seg.id, 'color'));

      /* 函数图像 */
      var f1 = board.addFunction('x^2-2x+1', { name: 'f', color: '#111111' });
      var f2 = board.addFunction('1/x', { name: 'g', color: '#c0399f' });
      function pathOf(color) {
        var list = stage.querySelectorAll('path');
        for (var i = 0; i < list.length; i += 1) {
          if (list[i].getAttribute('stroke') === color) return list[i];
        }
        return null;
      }
      var d1 = pathOf('#111111');
      var d2 = pathOf('#c0399f');
      function countM(d) { return (String(d).match(/M/g) || []).length; }
      ok('functiongraph：抛物线单段路径',
        !!f1 && f1.error === null && !!d1 && countM(d1.getAttribute('d')) === 1,
        'id=' + (f1 && f1.id) + ' M=' + (d1 ? countM(d1.getAttribute('d')) : 'no path'));
      ok('functiongraph：1/x 在 x=0 处断开（路径分成 ≥2 段）',
        !!f2 && f2.error === null && !!d2 && countM(d2.getAttribute('d')) >= 2,
        'id=' + (f2 && f2.id) + ' M=' + (d2 ? countM(d2.getAttribute('d')) : 'no path'));

      var badF = board.addFunction('1+');
      ok('addFunction：编译失败返回 error 且不创建图形',
        badF && badF.id === null && !!badF.error &&
        sc.expressions.length === 2,
        badF ? ('error=' + (badF.error && badF.error.message)) : 'null');

      /* 视口 */
      var w0 = board.toWorld(300, 200);
      board.zoomAt(300, 200, 1.5);
      var w1 = board.toWorld(300, 200);
      ok('zoomAt(300,200,1.5) 后光标处世界坐标不漂移',
        near(w0.x, w1.x, 1e-6) && near(w0.y, w1.y, 1e-6),
        'before=(' + w0.x + ',' + w0.y + ') after=(' + w1.x + ',' + w1.y + ')');

      var cx0 = sc.view.cx;
      board.panBy(48, 0);
      ok('panBy(48,0) 把 cx 左移 48/pxPerUnit',
        near(sc.view.cx, cx0 - 48 / sc.view.pxPerUnit, 1e-9),
        'cx ' + cx0.toFixed(3) + '→' + sc.view.cx.toFixed(3));

      var fitErr = null;
      try { board.fit(); } catch (e2) { fitErr = e2.message; }
      ok('fit() 不抛异常且给出合法缩放',
        !fitErr && sc.view.pxPerUnit >= 4 && sc.view.pxPerUnit <= 400,
        fitErr || ('pxPerUnit=' + sc.view.pxPerUnit.toFixed(2)));

      var objCount = sc.objects.length;
      var rebuildErr = null;
      try { board.rebuild(sc); } catch (e3) { rebuildErr = e3.message; }
      ok('rebuild(scene) 原地重建：对象数不变、派生标签仍是 M1/X1',
        !rebuildErr && sc.objects.length === objCount &&
        !!sc.objects.filter(function (o) { return o.label === 'M1'; }).length &&
        !!sc.objects.filter(function (o) { return o.label === 'X1'; }).length,
        rebuildErr || ('objects=' + sc.objects.length));

      /* ---------- 3.1 级联删除（独立画板，避免干扰上面的场景） ---------- */
      function scratch(hostId) {
        var s = {
          view: { cx: 0, cy: 0, pxPerUnit: 48 },
          params: {}, expressions: [], objects: [], script: '', autoRun: true
        };
        return { scene: s, h: B.create(document.getElementById(hostId), s, {}) };
      }

      var c2 = scratch('stage2');
      var b2 = c2.h, sc2 = c2.scene;
      var q1 = b2.addPoint(0, 0);        /* A */
      var q2 = b2.addPoint(2, 0);        /* B */
      var q3 = b2.addPoint(0, 2);        /* C */
      var q4 = b2.addPoint(0, 1);        /* D */
      var q5 = b2.addPoint(2, -0.5);     /* E */
      var sAB = b2.addSegment(q1.id, q2.id);          /* AB，依赖 B */
      var cA = b2.addCircle(q1.id, q2.id);            /* 以 A 为圆心过 B */
      var pgB = b2.addPolygon([q1.id, q2.id, q3.id]); /* 含 B 的三角形 */
      var sDE = b2.addSegment(q4.id, q5.id);          /* DE，与 B 无关 */
      var xAB = b2.addIntersection(sAB.id, sDE.id, 0);/* AB 与 DE 的交点 */
      var beforeDel = sc2.objects.length;
      var removedIds = b2.removeObject(q2.id) || [];
      var afterDel = sc2.objects.length;
      var goneAll = [q2.id, sAB.id, cA.id, pgB.id, xAB.id].every(function (id) {
        return removedIds.indexOf(id) >= 0 &&
          !sc2.objects.some(function (o) { return o.id === id; });
      });
      var keptDE = sc2.objects.some(function (o) { return o.id === sDE.id; });
      ok('级联删除：删 B 后线段 / 圆 / 多边形 / 交点一起消失且 scene.objects 同步',
        !!xAB && goneAll && keptDE &&
        removedIds.length === 5 && afterDel === beforeDel - 5 && afterDel === 5,
        'before=' + beforeDel + ' after=' + afterDel + ' removed=' + removedIds.length +
        ' 含=' + [q2.id, sAB.id, cA.id, pgB.id, xAB.id].join('/') + ' 保留DE=' + keptDE);
      b2.destroy();

      /* ---------- 3.2 线段标签冲突 ---------- */
      var c3 = scratch('stage3');
      var b3 = c3.h;
      var t1 = b3.addPoint(0, 0);
      var t2 = b3.addPoint(1, 0);
      var segFirst = b3.addSegment(t1.id, t2.id);
      var segDup = b3.addSegment(t1.id, t2.id);
      var labels3 = c3.scene.objects.map(function (o) { return o.label; });
      ok('线段标签冲突：同一对端点再画一条回退为 s1，不重复 AB',
        segFirst && segFirst.label === 'AB' && segDup && segDup.label === 's1' &&
        labels3.filter(function (l) { return l === 'AB'; }).length === 1,
        'first=' + (segFirst && segFirst.label) + ' dup=' + (segDup && segDup.label) +
        ' labels=' + labels3.join(','));
      b3.destroy();

      /* ---------- 3.3 点标签耗尽 ---------- */
      var c4 = scratch('stage4');
      var b4 = c4.h;
      var ptLabels = [];
      for (var pi = 0; pi < 30; pi += 1) {
        var newPt = b4.addPoint(pi % 6, Math.floor(pi / 6));
        ptLabels.push(newPt ? newPt.label : '?');
      }
      var uniqPt = {};
      for (var ui = 0; ui < ptLabels.length; ui += 1) uniqPt[ptLabels[ui]] = 1;
      ok('点标签耗尽：A…Z 用完后第 27 个起为 A1 / B1 …（30 个互不重复）',
        ptLabels.length === 30 && ptLabels[25] === 'Z' &&
        ptLabels[26] === 'A1' && ptLabels[27] === 'B1' && ptLabels[29] === 'D1' &&
        Object.keys(uniqPt).length === 30,
        'labels[24..29]=' + ptLabels.slice(24).join(',') + ' 唯一=' + Object.keys(uniqPt).length);
      b4.destroy();

      /* ---------- 3.4 Delete 键（覆盖 lab.js 的键盘路径，而非只测 board API） ---------- */
      var labHost = document.getElementById('labhost');
      var storeKey = (SL.KEYS && SL.KEYS.math) || 'sparklab:v1:math';
      var storeBackup = null;
      try { storeBackup = window.localStorage.getItem(storeKey); } catch (eS) { storeBackup = null; }
      var delObjsBefore = -1, delObjsAfter = -1, delSceneObjs = -1, delErr = '';
      try {
        var labApi = SL.math.lab.mount(labHost, {
          lab: { id: 'math-test-lab', meta: { name: '数学绘图器（回归）' } },
          onLeave: function () {}
        });
        /* 切「点」工具 → 在画布中心单击生成一个点（lab.js 会顺手选中它） */
        labHost.querySelector('[data-tool="point"]').dispatchEvent(
          new MouseEvent('click', { bubbles: true, cancelable: true }));
        var labBoardHost = labHost.querySelector('[data-role="board"]');
        var labRect = labBoardHost.getBoundingClientRect();
        labBoardHost.dispatchEvent(new MouseEvent('click', {
          bubbles: true, cancelable: true,
          clientX: labRect.left + labRect.width / 2,
          clientY: labRect.top + labRect.height / 2
        }));
        delObjsBefore = labHost.querySelectorAll('.obj-item').length;
        /* lab.js 把 keydown 绑在 document 上，这里照它的真实监听目标派发 */
        document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Delete', bubbles: true }));
        delObjsAfter = labHost.querySelectorAll('.obj-item').length;
        labApi.save();
        try {
          var dumpStore = JSON.parse(window.localStorage.getItem(storeKey) || '{}');
          delSceneObjs = (((dumpStore.scenes || {})['math-test-lab'] || {}).objects || []).length;
        } catch (eP) { delSceneObjs = -1; }
        labApi.destroy();
      } catch (eL) {
        delErr = (eL && eL.message) || String(eL);
      }
      /* 还原存档：测试不能污染真实场景 */
      try {
        if (storeBackup === null) window.localStorage.removeItem(storeKey);
        else window.localStorage.setItem(storeKey, storeBackup);
      } catch (eR) { /* localStorage 不可用时忽略 */ }
      ok('Delete 键：lab.js 监听 document，选中对象后按 Delete 被移除且存档同步',
        !delErr && delObjsBefore === 1 && delObjsAfter === 0 && delSceneObjs === 0 &&
        labHost.children.length === 0,
        delErr || ('列表 ' + delObjsBefore + '→' + delObjsAfter + ' 存档 objects=' + delSceneObjs +
          ' 卸载后子节点=' + labHost.children.length));

      /* 导出：先截获 blob，再单独验证 SVG 绘制非空白 */
      var captured = null;
      var origCreate = URL.createObjectURL;
      var origClick = HTMLAnchorElement.prototype.click;
      URL.createObjectURL = function (blob) {
        if (blob && blob.type === 'image/png') captured = blob;
        return origCreate.call(URL, blob);
      };
      HTMLAnchorElement.prototype.click = function () {};
      var svgKeep = stage.querySelector('svg');
      var svgXmlKeep = null;
      try { svgXmlKeep = new XMLSerializer().serializeToString(svgKeep); } catch (eX) { svgXmlKeep = null; }

      /* 给活动 SVG 打两个哨兵尺寸：exportPNG 只允许改克隆副本，不许碰活动节点 */
      var liveW0 = svgKeep.getAttribute('width');
      var liveH0 = svgKeep.getAttribute('height');
      svgKeep.setAttribute('width', '1234');
      svgKeep.setAttribute('height', '567');
      var exportPromise = board.exportPNG({ filename: 'math-test.png', scale: 2, white: true });
      var liveW1 = svgKeep.getAttribute('width');
      var liveH1 = svgKeep.getAttribute('height');
      svgKeep.setAttribute('width', liveW0);
      svgKeep.setAttribute('height', liveH0);
      ok('exportPNG 不改活动 SVG 的 width/height（只写克隆副本）',
        liveW1 === '1234' && liveH1 === '567',
        '导出前=1234×567 导出后=' + liveW1 + '×' + liveH1 + '（画布原值 ' + liveW0 + '×' + liveH0 + '）');

      function svgNonWhite(cb) {
        try {
          var xml = svgXmlKeep;
          var url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(xml);
          var img = new Image();
          img.onload = function () {
            try {
              var cv = document.createElement('canvas');
              cv.width = 480; cv.height = 300;
              var g = cv.getContext('2d');
              g.fillStyle = '#fff'; g.fillRect(0, 0, 480, 300);
              g.drawImage(img, 0, 0, 480, 300);
              var d = g.getImageData(0, 0, 480, 300).data;
              var non = 0;
              for (var i = 0; i < d.length; i += 4) {
                if (d[i] < 250 || d[i + 1] < 250 || d[i + 2] < 250) non += 1;
              }
              cb(non);
            } catch (e4) { cb(-1); }
          };
          img.onerror = function () { cb(-1); };
          img.src = url;
        } catch (e5) { cb(-2); }
      }

      board.destroy();
      ok('destroy() 清空容器', stage.children.length === 0,
        'children=' + stage.children.length);

      /* 收尾：等导出 Promise 与 SVG 采样，再补最后几条断言 */
      window.setTimeout(function () {
        var resolved = false;
        if (exportPromise && typeof exportPromise.then === 'function') {
          exportPromise.then(function (v) { resolved = v; }, function () { resolved = false; });
        }
        window.setTimeout(function () {
          /* 导出完成后再还原桩，否则真正的 createObjectURL 会绕过捕获 */
          URL.createObjectURL = origCreate;
          HTMLAnchorElement.prototype.click = origClick;
          ok('exportPNG 返回 Promise 并生成 PNG blob（> 5KB）',
            resolved === true && captured && captured.size > 5000,
            'resolved=' + resolved + ' size=' + (captured ? captured.size : 0));

          svgNonWhite(function (non) {
            ok('导出源 SVG 绘制非空白（非白像素 > 500）', non > 500, 'nonWhite=' + non);

            /* ================= 四、帮助页 ================= */
            ok('帮助 QUICKREF_HTML 非空且含 near 速查',
              typeof H.QUICKREF_HTML === 'string' && H.QUICKREF_HTML.length > 200 &&
              H.QUICKREF_HTML.indexOf('near') >= 0,
              'len=' + (H.QUICKREF_HTML || '').length);

            var dlg = H.open();
            var overlay = document.querySelector('.modal-overlay');
            ok('帮助 open() 生成 .modal-overlay 并可关闭（10 节）',
              !!dlg && !!overlay && typeof dlg.close === 'function' &&
              dlg.body.querySelectorAll('details').length === 10,
              'overlay=' + !!overlay + ' sections=' +
              (dlg ? dlg.body.querySelectorAll('details').length : 0));
            if (dlg && typeof dlg.close === 'function') dlg.close();

            window.setTimeout(function () {
              ok('帮助 关闭后 .modal-overlay 已移除',
                !document.querySelector('.modal-overlay'),
                'remaining=' + document.querySelectorAll('.modal-overlay').length);
              flush();
            }, 260);
          });
        }, 700);
      }, 60);
    }

    try { run(); }
    catch (e) {
      ok('测试脚本未抛出未捕获异常', false,
        (e && e.message) + ' | ' + ((e && e.stack) || '').split('\n').slice(0, 3).join(' / '));
      flush();
    }
  })();
  </script>
</body>
</html>
